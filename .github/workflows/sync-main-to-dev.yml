name: Auto-Sync Main to Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: Sync main into dev branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into dev
        run: |
          echo "Switching to dev branch..."
          git checkout dev
          
          echo "Pulling latest changes on dev..."
          git pull origin dev
          
          echo "Merging origin/main into dev..."
          git merge origin/main --no-edit -m "chore(sync): auto-merge main into dev [skip ci]"
          
          echo "Pushing merged changes to dev..."
          git push origin dev
