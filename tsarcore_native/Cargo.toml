[package]
name = "tsarcore_native"
version = "0.1.4"
edition = "2021"
description = "Native accel for TsarChain: secp256k1 verify (low-S), sigops counter, merkle_root, BIP143 SIGHASH (ALL), hash256/hash160, RandomX PoW, SecureChannel (X25519/HKDF/AES-GCM), plus fused LMDB/JSON storage bindings"
license = "MIT"

[lib]
name = "tsarcore_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
secp256k1 = "0.28"
sha2 = "0.10"
ripemd = "0.1"
rayon = { version = "1.10", optional = true }
hex = "0.4"
randomx-rs = { version = "1.4", default-features = false }
aes-gcm = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "1", features = ["std"] }
rand = "0.8"
lmdb = "0.8"
lmdb-sys = "0.8"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"

[features]
# Enable parallel verification in `secp_verify_der_low_s_many` when the `parallel` feature is set.
default = []
parallel = ["rayon"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

