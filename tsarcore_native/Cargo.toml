[package]
name = "tsarcore_native"
version = "0.2.3"
rust-version = "1.94.0"
edition = "2021"
description = "Native accel for TsarChain"
license = "MIT"

[lib]
name = "tsarcore_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0" }
secp256k1 = "0.31.1"
image = "0.25.10"
qrcode = "0.14.0"
rust_decimal = { version = "1.42.1", features = ["maths"] }
sha2 = "0.11.0"
ripemd = "0.2.0"
rayon = { version = "1.12.0", optional = true }
hex = "0.4"
randomx-rs = { version = "1.4", default-features = false }
aes-gcm = "0.11.0"
hkdf = "0.13.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
ed25519-dalek = "3.0.0"
rand_core = "0.10.1"
lmdb = "0.8"
lmdb-sys = "0.8"
libc = "0.2.186"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
ahash = "0.8"
num_cpus = "1.16"
rand = "0.10.2"

[features]
# Enable parallel verification in `secp_verify_der_low_s_many` when the `parallel` feature is set.
default = []
extension-module = ["pyo3/extension-module"]
parallel = ["rayon"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

